<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Customer · DailySales</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<th:block th:replace="~{layout :: layout(${pageTitle}, 'customers', ~{::section})}">
<section class="form-page">
    <a class="back-link" th:href="@{/customers}">← Back to customers</a>
    <div class="panel form-panel"><h2 th:text="${pageTitle}">Customer details</h2><p class="muted">Add contact information for invoice records.</p>
        <form th:action="@{/customers/save}" th:object="${customer}" method="post" class="form-grid">
            <input type="hidden" th:field="*{id}">
            <label class="span-2">Customer name<input th:field="*{name}" placeholder="Full name" required><small class="field-error" th:errors="*{name}"></small></label>
            <label class="span-2">Phone number<input th:field="*{phone}" type="tel" placeholder="Phone number" required><small class="field-error" th:errors="*{phone}"></small></label>
            <label class="span-2">Address<textarea th:field="*{address}" rows="3" placeholder="Street, city, postal code"></textarea><small class="field-error" th:errors="*{address}"></small></label>
            <div class="span-2 form-actions"><a class="button button-soft" th:href="@{/customers}">Cancel</a><button class="button button-primary">Save customer</button></div>
        </form>
    </div>
</section>
</th:block>
</body>
</html>
