<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Purchase history · DailySales</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<th:block th:replace="~{layout :: layout('Purchase history', 'customers', ~{::section})}">
<section>
    <a class="back-link" th:href="@{/customers}">← Back to customers</a>
    <div class="panel customer-summary"><span class="product-avatar customer-avatar" th:text="${#strings.substring(customer.name,0,1)}">C</span><div><h2 th:text="${customer.name}">Customer</h2><p class="muted" th:text="${customer.phone + ' · ' + (customer.address != null ? customer.address : '')}">Details</p></div></div>
    <section class="panel table-panel"><div class="panel-heading"><div><h2>Invoices</h2><p class="muted">Purchase history for this customer</p></div></div>
    <div class="table-scroll"><table><thead><tr><th>INVOICE</th><th>DATE</th><th>ITEMS</th><th>AMOUNT</th><th></th></tr></thead><tbody>
        <tr th:each="sale : ${purchases}"><td><a class="invoice-link" th:href="@{/invoices/{number}(number=${sale.invoiceNumber})}" th:text="${sale.invoiceNumber}">INV</a></td><td th:text="${#temporals.format(sale.saleDate,'dd MMM yyyy, HH:mm')}">Date</td><td th:text="${#lists.size(sale.items)} + ' items'">Items</td><td class="amount-cell" th:text="${'₹ ' + #numbers.formatDecimal(sale.total,1,'COMMA',2,'POINT')}">Total</td><td><a class="text-link" th:href="@{/invoices/{number}(number=${sale.invoiceNumber})}">View →</a></td></tr>
        <tr th:if="${#lists.isEmpty(purchases)}"><td colspan="5" class="empty-state">No purchases recorded for this customer.</td></tr>
    </tbody></table></div></section>
</section>
</th:block>
</body>
</html>
