<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Product · DailySales</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<th:block th:replace="~{layout :: layout(${pageTitle}, 'products', ~{::section})}">
<section class="form-page">
    <a class="back-link" th:href="@{/products}">← Back to products</a>
    <div class="panel form-panel"><h2 th:text="${pageTitle}">Product details</h2><p class="muted">Product price is the pre-tax unit price.</p>
        <form th:action="@{/products/save}" th:object="${product}" method="post" class="form-grid">
            <input type="hidden" th:field="*{id}">
            <label class="span-2">Product name<input th:field="*{name}" placeholder="e.g. Cotton notebook" required><small class="field-error" th:errors="*{name}"></small></label>
            <label>SKU<input th:field="*{sku}" placeholder="e.g. ST-1004" required><small class="field-error" th:errors="*{sku}"></small></label>
            <label>Unit price (₹)<input th:field="*{price}" type="number" step="0.01" min="0.01" required><small class="field-error" th:errors="*{price}"></small></label>
            <label>GST rate (%)<input th:field="*{gstRate}" type="number" step="0.01" min="0" max="100" required><small class="field-error" th:errors="*{gstRate}"></small></label>
            <label>Available stock<input th:field="*{stock}" type="number" min="0" required><small class="field-error" th:errors="*{stock}"></small></label>
            <label>Low-stock alert at<input th:field="*{lowStockThreshold}" type="number" min="0" required><small class="field-error" th:errors="*{lowStockThreshold}"></small></label>
            <div class="span-2 form-actions"><a class="button button-soft" th:href="@{/products}">Cancel</a><button class="button button-primary">Save product</button></div>
        </form>
    </div>
</section>
</th:block>
</body>
</html>
