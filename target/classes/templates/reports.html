<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sales reports · DailySales</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<th:block th:replace="~{layout :: layout('Sales reports', 'reports', ~{::section})}">
<section>
    <div class="welcome-row"><p class="muted">Analyze sales for a period and export the underlying invoices.</p></div>
    <form class="panel report-filter" th:action="@{/reports}" method="get">
        <label class="field-label">Quick range<select name="period" id="periodSelect"><option value="custom" th:selected="${period == 'custom'}">Custom dates</option><option value="daily" th:selected="${period == 'daily'}">Today</option><option value="weekly" th:selected="${period == 'weekly'}">Last 7 days</option><option value="monthly" th:selected="${period == 'monthly'}">This month</option><option value="yearly" th:selected="${period == 'yearly'}">This year</option></select></label>
        <label class="field-label">From<input type="date" name="start" th:value="${start}" required></label>
        <label class="field-label">To<input type="date" name="end" th:value="${end}" required></label>
        <button class="button button-primary filter-button">Apply filter</button>
    </form>
    <div class="report-summary">
        <article class="stat-card"><span class="stat-label">REPORT REVENUE</span><div class="stat-value" th:text="${'₹ ' + #numbers.formatDecimal(total,1,'COMMA',2,'POINT')}">₹0.00</div><div class="stat-foot" th:text="${#temporals.format(start,'dd MMM yyyy') + ' — ' + #temporals.format(end,'dd MMM yyyy')}">Date range</div></article>
        <article class="stat-card"><span class="stat-label">INVOICES</span><div class="stat-value" th:text="${#lists.size(records)}">0</div><div class="stat-foot">Transactions in selected range</div></article>
        <div class="export-buttons"><a class="button button-soft" th:href="@{/reports/excel(start=${start},end=${end})}">↓ Excel</a><a class="button button-soft" th:href="@{/reports/pdf(start=${start},end=${end})}">↓ PDF</a></div>
    </div>
    <section class="panel table-panel"><div class="panel-heading"><div><h2>Sales detail</h2><p class="muted">Invoices from selected dates</p></div></div>
    <div class="table-scroll"><table><thead><tr><th>INVOICE</th><th>CUSTOMER</th><th>DATE</th><th>SUBTOTAL</th><th>TAX</th><th>TOTAL</th></tr></thead><tbody>
        <tr th:each="sale : ${records}"><td><a class="invoice-link" th:href="@{/invoices/{n}(n=${sale.invoiceNumber})}" th:text="${sale.invoiceNumber}">INV</a></td><td th:text="${sale.customer.name}">Customer</td><td th:text="${#temporals.format(sale.saleDate,'dd MMM yyyy, HH:mm')}">Date</td><td th:text="${'₹ ' + #numbers.formatDecimal(sale.subtotal,1,'COMMA',2,'POINT')}">₹0</td><td th:text="${'₹ ' + #numbers.formatDecimal(sale.cgst + sale.sgst + sale.igst,1,'COMMA',2,'POINT')}">₹0</td><td class="amount-cell" th:text="${'₹ ' + #numbers.formatDecimal(sale.total,1,'COMMA',2,'POINT')}">₹0</td></tr>
        <tr th:if="${#lists.isEmpty(records)}"><td colspan="6" class="empty-state">No sales in this date range.</td></tr>
    </tbody></table></div></section>
    <script>
        document.getElementById('periodSelect').addEventListener('change', event => {
            if (event.target.value !== 'custom') event.target.form.requestSubmit();
        });
    </script>
</section>
</th:block>
</body>
</html>
