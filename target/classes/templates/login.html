<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · DailySales</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">
<div class="login-decoration"></div>
<main class="login-card">
    <a class="brand login-brand" th:href="@{/login}"><span class="brand-mark">D</span><span>Daily<span class="brand-light">Sales</span><small>GST MANAGEMENT</small></span></a>
    <div class="login-intro"><span class="eyebrow">WELCOME BACK</span><h1>Sign in to your<br>workspace.</h1><p>Manage your sales, inventory and invoices in one place.</p></div>
    <div th:if="${param.error}" class="alert alert-error">Invalid username or password. Please try again.</div>
    <div th:if="${param.logout}" class="alert alert-success">You have been signed out.</div>
    <form th:action="@{/login}" method="post" class="form-stack">
        <label>Username<input name="username" type="text" autocomplete="username" placeholder="Enter your username" required autofocus></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required></label>
        <button class="button btn button-primary button-wide" type="submit">Sign in <span>→</span></button>
    </form>
    <p class="login-foot">Secure administrator access</p>
</main>
<div class="login-side-note">A clearer view of your business, every day.</div>
</body>
</html>
