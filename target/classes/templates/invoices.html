<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Invoices · DailySales</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<th:block th:replace="~{layout :: layout('Invoices', 'invoices', ~{::section})}">
<section>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div class="welcome-row"><p class="muted">Search, view, print and download your customer invoices.</p><a class="button button-primary" th:href="@{/billing}">＋ Create invoice</a></div>
    <section class="panel table-panel"><div class="panel-heading"><div><h2>Invoice history</h2><p class="muted" th:text="${#lists.size(invoices) + ' invoices'}">0 invoices</p></div>
        <form class="search-form" th:action="@{/invoices}" method="get"><input type="search" name="q" th:value="${q}" placeholder="Invoice or customer"><button class="button button-soft">Search</button></form>
    </div>
    <div class="table-scroll"><table><thead><tr><th>INVOICE</th><th>CUSTOMER</th><th>DATE</th><th>ITEMS</th><th>AMOUNT</th><th></th></tr></thead><tbody>
        <tr th:each="sale : ${invoices}"><td><a class="invoice-link" th:href="@{/invoices/{number}(number=${sale.invoiceNumber})}" th:text="${sale.invoiceNumber}">INV</a></td><td th:text="${sale.customer.name}">Customer</td><td th:text="${#temporals.format(sale.saleDate,'dd MMM yyyy, HH:mm')}">Date</td><td th:text="${#lists.size(sale.items)} + ' items'">Items</td><td class="amount-cell" th:text="${'₹ ' + #numbers.formatDecimal(sale.total,1,'COMMA',2,'POINT')}">₹0.00</td><td><a class="row-arrow" th:href="@{/invoices/{number}(number=${sale.invoiceNumber})}">→</a></td></tr>
        <tr th:if="${#lists.isEmpty(invoices)}"><td colspan="6" class="empty-state">No matching invoices found.</td></tr>
    </tbody></table></div></section>
</section>
</th:block>
</body>
</html>
