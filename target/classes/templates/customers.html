<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Customers · DailySales</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<th:block th:replace="~{layout :: layout('Customers', 'customers', ~{::section})}">
<section>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div><div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div class="welcome-row"><p class="muted">Keep customer details and purchase history organized.</p><a class="button button-primary" th:href="@{/customers/new}">＋ Add customer</a></div>
    <section class="panel table-panel"><div class="panel-heading"><div><h2>Customer directory</h2><p class="muted" th:text="${#lists.size(customers) + ' customers'}">0 customers</p></div></div>
    <div class="table-scroll"><table><thead><tr><th>CUSTOMER</th><th>PHONE</th><th>ADDRESS</th><th></th></tr></thead><tbody>
        <tr th:each="c : ${customers}"><td><div class="table-product"><span class="product-avatar customer-avatar" th:text="${#strings.substring(c.name,0,1)}">C</span><strong th:text="${c.name}">Customer</strong></div></td><td th:text="${c.phone}">Phone</td><td th:text="${c.address != null and !c.address.isBlank() ? c.address : '—'}">Address</td><td class="actions"><a class="button button-soft button-small" th:href="@{/customers/{id}/history(id=${c.id})}">History</a><a class="button button-soft button-small" th:href="@{/customers/{id}/edit(id=${c.id})}">Edit</a><form th:action="@{/customers/{id}/delete(id=${c.id})}" method="post" onsubmit="return confirm('Delete this customer?')"><button class="button button-danger button-small">Delete</button></form></td></tr>
        <tr th:if="${#lists.isEmpty(customers)}"><td colspan="4" class="empty-state">No customers yet. Add a customer to create invoices.</td></tr>
    </tbody></table></div></section>
</section>
</th:block>
</body>
</html>
